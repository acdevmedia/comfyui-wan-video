name: Validate and build video bundle
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Source checks
        run: |
          python3 tests/test-bundle.py
          python3 tests/test-hub.py
          bash tests/test-cpu-threads.sh
          python3 scripts/build-workflows.py
          # Also catches newly generated files that were never committed.
          git status --porcelain -- versions | tee /dev/stderr | (! grep -q .)
      - name: Free runner disk for the CUDA/PyTorch image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and run CPU schema smoke test
        run: |
          docker buildx build --load --label "org.opencontainers.image.revision=$GITHUB_SHA" -t video-bundle:test .
          docker run --rm --entrypoint python3 video-bundle:test /opt/video/scripts/smoke-schemas.py
          docker run --rm --entrypoint bash video-bundle:test /opt/video/scripts/test-copyparty.sh
      - name: Publish tested image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/wan-comfyui
        run: |
          docker tag video-bundle:test "$IMAGE:2.2"
          docker tag video-bundle:test "$IMAGE:sha-${{ github.sha }}"
          docker push "$IMAGE:2.2"
          docker push "$IMAGE:sha-${{ github.sha }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag video-bundle:test "$IMAGE:${GITHUB_REF_NAME}"
            docker push "$IMAGE:${GITHUB_REF_NAME}"
          fi
      - name: Package versioned release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/package-release.py
          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Video bundle $GITHUB_REF_NAME" --notes-file dist/RELEASE.md "${release_args[@]}"

